name: Bug report
description: Something is broken or behaves differently than documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include tokens, API keys, or private session content.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: The page appears, but clicking submit never returns...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Prompt, page HTML, and steps. A minimal HTML page is ideal.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dsh-surface version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeekRuntime version
      placeholder: 0.2.1-rc.2
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - dsh web (browser)
        - dsh desktop (Electron)
        - headless / TUI
        - other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Browser console, dsh output, or a screenshot. Redact secrets.
      render: shell
    validations:
      required: false
