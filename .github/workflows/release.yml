name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs a newer CLI than the one bundled with Node 22.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Install
        run: npm ci

      - name: Verify tag and registry state
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "package.json version ($version) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "dsh-surface@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "dsh-surface@$version is already on npm; skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check
        run: npm run check

      # No NODE_AUTH_TOKEN on purpose: npm exchanges the OIDC token for a
      # short-lived publish credential granted by the trusted publisher.
      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: npm publish --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
